<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#0d1117"/>
  <text x="480" y="32" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Przepływ muzyki</text>

  <!-- Główny łańcuch (pionowo, kolumna środkowa) -->
  <g>
    <rect x="190" y="56" width="300" height="52" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
    <text x="340" y="87" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Soulseek (sieć P2P)</text>
  </g>
  <path d="M340 108 L340 118" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="118" width="300" height="52" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="340" y="149" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-slskd</text>
  </g>
  <path d="M340 170 L340 180" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="180" width="300" height="52" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="340" y="211" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">incoming/ (pobrania)</text>
  </g>
  <path d="M340 232 L340 242" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="242" width="300" height="52" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="340" y="273" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-beets (tagi · ReplayGain)</text>
  </g>
  <path d="M340 294 L340 304" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="304" width="300" height="52" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="340" y="335" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Biblioteka (dysk USB)</text>
  </g>
  <path d="M340 356 L340 366" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="366" width="300" height="52" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="340" y="397" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Navidrome (serwowanie)</text>
  </g>
  <path d="M340 418 L340 428" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="428" width="300" height="52" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="340" y="459" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Caddy (proxy + UI)</text>
  </g>
  <path d="M340 480 L340 490" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="490" width="300" height="52" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <text x="340" y="521" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Cloudflare Tunnel</text>
  </g>
  <path d="M340 542 L340 552" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="190" y="552" width="300" height="52" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
    <text x="340" y="583" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Użytkownik (odsłuch)</text>
  </g>

  <!-- Pętla odkrywania (prawa strona) -->
  <g>
    <rect x="660" y="180" width="260" height="140" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="790" y="212" fill="#e6edf3" font-size="16" font-weight="700" text-anchor="middle">piterfy-discover</text>
    <text x="790" y="232" fill="#8b949e" font-size="11" text-anchor="middle">analizuje historię i gust,</text>
    <text x="790" y="250" fill="#8b949e" font-size="11" text-anchor="middle">szuka nowości, buduje playlisty</text>
    <text x="790" y="268" fill="#8b949e" font-size="11" text-anchor="middle">„Odkrywaj”, wysyła raporty</text>
  </g>

  <!-- strzałki pętli -->
  <path d="M490 150 L660 200" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="540" y="168" fill="#58a6ff" font-size="10">wyszukiwanie (API slskd)</text>

  <path d="M490 392 L660 300" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="540" y="342" fill="#58a6ff" font-size="10">historia odsłuchów</text>

  <path d="M660 260 L490 400" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="540" y="330" fill="#58a6ff" font-size="10">playlisty → Navidrome</text>
</svg>
