<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="960" height="720" fill="#0d1117"/>
  <text x="480" y="34" fill="#e6edf3" font-size="22" font-weight="700" text-anchor="middle">Piterfy — architektura</text>

  <!-- Główny łańcuch: internet -> tunel -> proxy -> Navidrome -->
  <g>
    <rect x="340" y="56" width="280" height="54" rx="10" fill="#161b22" stroke="#9198a1" stroke-width="1.5"/>
    <text x="480" y="88" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Użytkownik</text>
    <text x="480" y="104" fill="#8b949e" font-size="11" text-anchor="middle">przeglądarka / aplikacja</text>
  </g>
  <path d="M480 110 L480 152" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="340" y="152" width="280" height="54" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
    <text x="480" y="184" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Cloudflare Tunnel</text>
    <text x="480" y="200" fill="#8b949e" font-size="11" text-anchor="middle">piterfy-cloudflared</text>
  </g>
  <path d="M480 206 L480 248" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="340" y="248" width="280" height="54" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="480" y="280" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Caddy</text>
    <text x="480" y="296" fill="#8b949e" font-size="11" text-anchor="middle">reverse proxy + UI Piterfy</text>
  </g>
  <path d="M480 302 L480 360" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <g>
    <rect x="330" y="360" width="300" height="62" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="480" y="392" fill="#e6edf3" font-size="17" font-weight="700" text-anchor="middle">Navidrome</text>
    <text x="480" y="410" fill="#8b949e" font-size="11" text-anchor="middle">serwer muzyki (port 4533)</text>
  </g>

  <!-- Pipeline odkrywania (lewa kolumna) -->
  <g>
    <rect x="44" y="360" width="236" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="162" y="390" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-discover</text>
    <text x="162" y="408" fill="#8b949e" font-size="11" text-anchor="middle">odkrywanie · playlisty · raporty</text>
  </g>
  <path d="M280 391 L330 391" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="305" y="384" fill="#58a6ff" font-size="10" text-anchor="middle">historia</text>

  <g>
    <rect x="44" y="456" width="236" height="62" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="162" y="486" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-slskd</text>
    <text x="162" y="504" fill="#8b949e" font-size="11" text-anchor="middle">Soulseek — pobieranie</text>
  </g>
  <path d="M162 422 L162 456" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="172" y="442" fill="#8b949e" font-size="10">wyszukiwanie / pobieranie</text>

  <g>
    <rect x="44" y="552" width="236" height="62" rx="10" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <text x="162" y="582" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-beets</text>
    <text x="162" y="600" fill="#8b949e" font-size="11" text-anchor="middle">tagi · ReplayGain · widmo</text>
  </g>
  <path d="M162 518 L162 552" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="172" y="538" fill="#8b949e" font-size="10">pobrania (incoming)</text>

  <!-- Usługi pomocnicze (prawa kolumna) -->
  <g>
    <rect x="680" y="360" width="236" height="62" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="798" y="390" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-dj</text>
    <text x="798" y="408" fill="#8b949e" font-size="11" text-anchor="middle">miksy / radio</text>
  </g>
  <path d="M680 391 L630 391" stroke="#8b949e" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <g>
    <rect x="680" y="456" width="236" height="62" rx="10" fill="#161b22" stroke="#39d2c0" stroke-width="1.5"/>
    <text x="798" y="486" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">piterfy-connect</text>
    <text x="798" y="504" fill="#8b949e" font-size="11" text-anchor="middle">mostek API</text>
  </g>
  <path d="M680 487 L630 420" stroke="#8b949e" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Magazyn: dysk USB -->
  <g>
    <rect x="300" y="660" width="360" height="48" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="480" y="688" fill="#e6edf3" font-size="15" font-weight="600" text-anchor="middle">Dysk USB — /srv/media/USB/Muzyka</text>
    <text x="480" y="702" fill="#8b949e" font-size="10" text-anchor="middle">biblioteka (udostępniana przez Navidrome, discover i beets)</text>
  </g>
  <path d="M480 422 L480 660" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="492" y="560" fill="#8b949e" font-size="10">serwuje bibliotekę</text>
  <path d="M162 614 L162 684 L300 684" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="180" y="662" fill="#8b949e" font-size="10">import (tagi)</text>
</svg>
